[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "metric-app"
version = "0.1.0"
description = "Python sample that gives every Testable Python whitebox tool something to measure"
requires-python = ">=3.11"
dependencies = [
    "jinja2==3.1.3",
    "urllib3==1.26.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
