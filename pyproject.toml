[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgerly"
version = "0.1.0"
description = "Invoicing, tax and aging helpers for small billing back offices"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jinja2==3.1.3",
    "requests==2.31.0",
    "urllib3==1.26.18",
]

[tool.setuptools.packages.find]
include = ["ledgerly*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["ledgerly"]
